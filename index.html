<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双语论文库</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
max-width:960px;margin:0 auto;padding:24px;background:#fafafa;color:#222}
h1{font-size:22px} h1 small{font-weight:normal;color:#888;font-size:14px}
#q{width:100%;box-sizing:border-box;padding:10px 14px;font-size:15px;
border:1px solid #ddd;border-radius:8px;margin:12px 0 8px}
.count{color:#666;font-size:13px;margin-bottom:12px}
details{background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:14px;padding:4px 14px}
summary{font-size:17px;font-weight:600;padding:10px 0;cursor:pointer}
summary .cnt{color:#999;font-weight:normal;font-size:13px;margin-left:8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid #f2f2f2}
.item .title{flex:1;font-size:15px;line-height:1.5}
.btns{display:flex;gap:6px;flex-shrink:0}
.btn{display:inline-block;padding:3px 12px;border-radius:6px;font-size:13px;
text-decoration:none;border:1px solid currentColor}
.btn.dual{color:#1a56db}.btn.mono{color:#0f766e}.btn.orig{color:#64748b}
.btn:hover{background:#eef3ff}
</style>
</head>
<body>
<h1>📚 双语论文库 <small>原文 · 中文 · 双语 · 点击按钮阅读</small></h1>
<input id="q" type="search" placeholder="搜索论文标题…" autofocus>
<div class="count" id="count"></div>
<div id="list">

</div>
<script>
const secs=[...document.querySelectorAll('details')];
const items=[...document.querySelectorAll('.item')];
const count=document.getElementById('count');
function update(){const q=document.getElementById('q').value.trim().toLowerCase();
let n=0;for(const it of items){const show=it.dataset.key.includes(q);
it.style.display=show?'':'none';if(show)n++;}
for(const s of secs){const vis=[...s.querySelectorAll('.item')].filter(i=>i.style.display!=='none');
s.style.display=vis.length?'':'none';
s.querySelector('summary .cnt').textContent=`(${vis.length})`;}
count.textContent=`共 ${items.length} 篇，当前显示 ${n} 篇`;}
document.getElementById('q').addEventListener('input',update);update();
</script>
</body>
</html>
